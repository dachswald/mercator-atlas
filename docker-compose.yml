version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mercator-postgres
    restart: always
    environment:
      POSTGRES_USER: mercator_admin
      POSTGRES_PASSWORD: mercator_secure_password_2026
      POSTGRES_DB: mercator_atlas_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercator_admin -d mercator_atlas_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mercator-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://mercator_admin:mercator_secure_password_2026@postgres:5432/mercator_atlas_prod?schema=public"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  